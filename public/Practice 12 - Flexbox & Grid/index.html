<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/public/style.css">
</head>
<body>
    <!-- Flex -->
    <div class="flex *:ml-10 *:bg-blue-500">
        <div>A</div>
        <Div>B</Div>
        <Div>C</Div>
    </div>
    <!-- Grid -->
     <div class="grid *:h-20 *:w-20 *:bg-red-500">
        <div class="bg-red-200">A</div>
        <div>B</div>
        <div>C</div>
     </div>
     <!-- Grid Column Start / End -->
      <div class="ml-20 grid grid-cols-4 *:h-20 *:w-20 *:bg-sky-400">
        <div class="col-start-3">1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
      </div>
      <!-- Grid Row Start / End -->
       <div class="ml-20 grid grid-cols-4 *:h-20 *:w-20 *:bg-red-400">
        <div class="row-start-3">1</div>
        <div class="col-start-4 row-start-2">2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
      </div>
      <!-- Gap -->
       <div class="grid grid-cols-4 gap-4 *:h-20 *:w-20 *:bg-violet-500">
         <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
       </div>
                                <!-- Justify -->
        <!-- Center -->
         <div class="flex justify-center *:w-20 *:bg-blue-300">
            <div>1</div>
            <div>2</div>
            <div>3</div>
         </div>
         <!-- Evenly -->
          <div class="flex justify-evenly *:w-20 *:bg-slate-600">
            <div>1</div>
            <div>2</div>
            <div>3</div>
          </div>
          <!-- End -->
           <div class="flex justify-end *:w-20 *:bg-lime-500">
            <div>1</div>
            <div>2</div>
            <div>3</div>
           </div>
           <!-- Item Center -->
            <div class="grid justify-items-center *:w-20 *:bg-orange-500">
                <div>1</div>
                <div>2</div>
                <div>3</div>
            </div>
            <!-- Item Self -->
             <div class="grid *:w-20 *:bg-green-300">
                <div class="justify-self-center">1</div>
                <div class="justify-self-end">2</div>
                <div class="justify-self-start">3</div>
             </div>
                                <!-- Alignment -->
             <div class="grid h-56 grid-cols-3 content-end gap-4 bg-red-200 *:bg-blue-500">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
             </div>
             <!-- Item -->
              <div class="flex h-20 items-center gap-3 bg-blue-300 *:w-20 *:bg-green-300">
                <div class="flex h-full items-center">1</div>
                <div class="flex h-full items-end">2</div>
                <div class="flex h-full items-start">3</div>
              </div>
              <!-- Self -->
               <div class="flex h-20 bg-sky-500 *:w-20 *:bg-slate-600">
                <div class="self-start">1</div>
                <div class="self-center">2</div>
                <div class="self-end">3</div>
               </div>
                            <!-- Place -->
               <div class="grid h-40 grid-cols-2 place-content-center gap-4 bg-red-500 *:bg-yellow-400">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
               </div>
               <!-- Item -->
                <div class="grid h-40 grid-cols-3 place-items-center gap-4 bg-amber-400 *:w-full *:bg-sky-400">
                    <div>1</div>
                    <div>2</div>
                    <div>3</div>
                    <div>4</div>
                </div>
                <!-- Self -->
                 <div class="grid h-40 grid-cols-2 gap-4 bg-teal-400 *:bg-yellow-500">
                    <div class="w-full place-self-start">1</div>
                    <div class="w-full place-self-center">2</div>
                    <div class="w-full place-self-end">3</div>
                 </div>
</body>
</html>
