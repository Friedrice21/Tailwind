<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/public/style.css">
</head>
<body>
            <!-- Transform -->
    <!-- Scale -->
    <div class="mx-auto w-40 h-40 scale-50 bg-kucing bg-contain hover:scale-105"></div>
    <!-- Rotate -->
     <div class="mx-auto w-40 h-40 rotate-12 scale-75 bg-kucing bg-contain hover:rotate-0"></div>
     <!-- Translate -->
      <div class="mx-auto w-40 h-40 translate-x-11 scale-75 bg-kucing bg-contain hover:translate-x-0"></div>
      <!-- Skew -->
       <div class="mx-auto w-40 h-40 skew-x-12 scale-75 bg-kucing bg-contain hover:skew-x-0"></div>
       <!-- Origin -->
       <div class="mx-auto w-40 h-40 origin-bottom-right scale-75 bg-kucing bg-contain transition-all hover:origin-center"></div>

            <!-- Transition -->
    <!-- Property -->
     <button class="duration-100 mx-auto mt-10 flex h-40 w-40 scale-50 bg-lime-300 transition-all hover:scale-100 hover:bg-purple-200">Skit</button>
     <!-- Timing Func -->
      <button class="duration-300 ease-in-out hover:scale-95">James Button</button>
      <!-- Delay -->
       <button class="delay-500 duration-300 ease-linear hover:scale-75">Bwoah</button>

            <!-- Animation -->
    <!-- Spin -->
    <div class="mx-auto w-20 h-20 bg-slate-500">
        <img
         src="/public/Practice/kucing.jpeg"
         alt=""
         class="mx-auto w-10 animate-spin md:animate-bounce lg:animate-ping xl:animate-pulse hover:scale-75">
    </div>
</body>
</html>
