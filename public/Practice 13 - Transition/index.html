<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/public/style.css">
</head>
<body>
    <!--            Transform                -->
    <!-- Scale -->
    <div class="mx-auto h-80 w-80 scale-75 bg-kucing bg-contain hover:scale-100"></div>
    <!-- Rotate -->
     <div class="mx-auto h-80 w-80 rotate-12 scale-75 bg-kucing bg-contain hover:rotate-0"></div>
     <!-- Translate -->
      <div class="mx-auto h-80 w-80 translate-x-10 scale-75 bg-kucing bg-contain transition-all hover:translate-x-0"></div>
      <!-- Skew -->
       <div class="mx-auto h-80 w-80 skew-x-12 scale-75 bg-kucing bg-contain transition-all hover:skew-x-0"></div>
       <!-- Transform Origin -->
        <div class="mx-auto w-80 h-80 origin-top-left scale-75 bg-kucing bg-contain transition-all hover:origin-center"></div>
    <!--            Transition               -->
    <!-- Transition Property -->
     <button class="duration-1000 mx-auto mt-10 flex h-20 w-20 scale-50 bg-blue-200 transition-all hover:scale-100 hover:bg-red-500"></button>
     <!-- Timing Function -->
      <button class="duration-300 ease-linear hover:scale-75">Ease Linear</button>
      <button class="duration-300 ease-in hover:scale-75">Ease In</button>
      <button class="duration-300 ease-out hover:scale-75">Ease out</button>
      <button class="duration-300 ease-in-out hover:scale-75">Ease-in-out</button>
      <!-- Transition Delay -->
       <button class="delay-1000 duration-300 ease-in hover:scale-75">Button A</button>
       <button class="delay-100 duration-300 ease-out hover:scale-75">Button B</button>
       <button class="delay-[2000ms] duration-300 ease-in-out hover:scale-75">Button C</button>
       <!--         Animation            -->
    <div class="mx-auto h-20 w-1/5 rounded-3xl bg-pink-500 p-10">
        <img 
        src="/public/Practice/kucing.jpeg" 
        alt=""
        class="mx-auto w-5 animate-spin md:animate-bounce">
    </div>
</body>
</html>
