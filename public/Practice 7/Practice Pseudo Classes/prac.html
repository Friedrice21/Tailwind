<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/public/style.css">
</head>
     <body class="min-h-screen bg-white dark:bg-slate-800">
    <div class="flex justify-center">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
</svg>
<input type="checkbox" id="slide" class="hidden">
<label for="slide">
    <div 
    class="flex h-5 w-10 cursor-pointer items-center rounded-full bg-slate-400 p-1">
<div 
    class="-mt-[3px] h-4 w-4 rounded-full bg-white dark:translate-x-3"
    ></div>
</div>
</label>
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
</svg>
    </div>
    <!-- Number 1 -->
    <button class="ml-40 mt-20 bg-sky-500 hover:bg-sky-700 hover:text-purple-400">Save</button>
    <button class="bg-slate-500 focus:bg-lime-400">Safe</button>
    <button class="bg-amber-400 active:bg-cyan-300">Saving</button>
    <!-- Number 2 -->
     <div class="group mx-auto mt-20 h-[50px] w-[50px] bg-slate-600">
        <div class="mx-auto h-[25px] w-[25px] bg-amber-400 group-active:bg-yellow-100"></div>
     </div>
     <div class="mt-20 flex justify-evenly bg-pink-500 *:h-20 *:w-20 *:bg-blue-500">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
     </div>
     <!-- Number 3 -->
      <!-- Number 4 -->
       <Div class="mx-auto border border-solid bg-center text-center">
        <div><h2>Welcome Back</h2></div>
        <div class="mx-auto ml-16 md:ml-72 lg:ml-[410px]">
            <input
            disabled
             type="id"
             id="id"
             class="block w-fit rounded border px-3 py-3 text-sm shadow bg-lime-50"
             placeholder="ID">
            </div>
            <div class="mx-auto ml-16 md:ml-72 lg:ml-[410px]"><input
                invalid
                type="email"
                id="email"
                class="block w-fit rounded border px-3 py-3 text-sm shadow bg-lime-50"
                placeholder="Email">
            </div>
            <div class="mx-auto ml-16 md:ml-72 lg:ml-[410px]"><input
                required
                type="username"
                id="username"
                class="block w-fit rounded border px-3 py-3 text-sm shadow bg-lime-50"
                placeholder="Username">
            </div>
            <div class="mx-auto ml-16 md:ml-72 lg:ml-[410px]"><input
                required
                type="password"
                id="password"
                class="block w-fit rounded border px-3 py-3 text-sm shadow bg-lime-50"
                placeholder="Password">
            </div>
       </Div>
       <button class="bg-lime-200 active:bg-lime-500"><a href="/public/Practice 7/Practice Pseudo Classes/hp.html">Log In</a></button>
    </body>
     <script>
    const checkbox = document.querySelector("#slide");
    const html = document.querySelector("html");

    checkbox.addEventListener("click", function () {
        checkbox.checked
        ? html.classList.add("dark")
        : html.classList.remove("dark");
    })
</script>
</html>
