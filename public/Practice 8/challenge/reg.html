<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/public/style.css">
</head>
<body>
    <div class="border-2 border-lime-800 text-center mx-auto">
    <h2>Signin</h2>
     <div class="mx-auto">
            <div><input
                invalid
                type="email"
                id="email"
                class="block w-fit rounded border px-3 py-3 text-sm shadow bg-lime-50"
                placeholder="Email">
            </div>
            <div><input
                required
                type="username"
                id="username"
                class="block w-fit rounded border px-3 py-3 text-sm shadow bg-lime-50"
                placeholder="Username">
            </div>
            <div><input
                required
                type="password"
                id="password"
                class="block w-fit rounded border px-3 py-3 text-sm shadow bg-lime-50"
                placeholder="Password">
            </div>
             <button class="bg-lime-200 active:bg-lime-500"><a href="/public/Practice 7/Practice Pseudo Classes/hp.html">Sign In</a></button>
             </div>
</body>
